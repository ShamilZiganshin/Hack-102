<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет осмотра</title><style>
*{box-sizing:border-box}body{font:16px/1.45 system-ui;margin:0;background:#edf3f0;color:#193c3c}header{background:#123c3d;color:white;padding:22px max(5vw,18px)}main{max-width:960px;margin:25px auto;padding:0 15px}section,article{background:white;border-radius:14px;padding:18px;margin:12px 0}h1,h2,h3,p{margin:0 0 10px}input,select,textarea,button,a{font:inherit}input,select,textarea{padding:9px;border:1px solid #aabeb8;border-radius:7px;max-width:100%}button,a.action{display:inline-block;background:#175849;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer;text-decoration:none}button.alt{background:#e4efeb;color:#21443a}form,.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}label{display:grid;gap:4px}article img{max-height:260px;max-width:100%;object-fit:contain}summary{cursor:pointer}#msg{color:#933d22;position:sticky;top:0;background:#fff}small{color:#536c68}textarea{width:100%}
</style><header><h1 id="title">Осмотр оборудования</h1><span id="who"></span></header><main><p id="msg" role="status"></p><section id="login" hidden><h2>Вход</h2><form id="signin"><label>Логин<input name="login" required autocomplete="username"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button>Войти</button></form></section><div id="cab" hidden><div class="row"><a id="camera" class="action" href="/mobile.html">Открыть камеру</a><button id="logout" class="alt">Выйти</button></div><section id="accounts" hidden><h2>Учётные записи</h2><div id="users"></div><button id="newUser">Создать пользователя</button><form id="editor" hidden><input name="id" type="hidden"><label>Логин<input name="login" required></label><label>Роль<select name="role"><option value="worker">Работник</option><option value="brigadir">Начальник цеха</option><option value="admin">Администратор</option></select></label><label>Новый пароль<input name="password" type="password" autocomplete="new-password"></label><button>Сохранить</button></form></section><h2>История осмотров</h2><div id="records"></div><button id="more" hidden>Ещё записи</button></div></main><script src="/field.js"></script></html>
