<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КСТ · Кабинет осмотра</title><style>
*{box-sizing:border-box}body{font:16px/1.45 system-ui;margin:0;background:#edf3f0;color:#193c3c}header{background:#123c3d;color:white;padding:22px max(5vw,18px)}main{max-width:960px;margin:25px auto;padding:0 15px}section,article{background:white;border-radius:14px;padding:18px;margin:12px 0}h1,h2,h3,p{margin:0 0 10px}input,select,textarea,button,a{font:inherit}input,select,textarea{padding:9px;border:1px solid #aabeb8;border-radius:7px;max-width:100%}button,a.action{display:inline-block;background:#175849;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer;text-decoration:none}button.alt{background:#e4efeb;color:#21443a}form,.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}label{display:grid;gap:4px}article img{max-height:260px;max-width:100%;object-fit:contain}summary{cursor:pointer}#msg{color:#933d22;position:sticky;top:0;background:#fff}small{color:#536c68}textarea{width:100%}
</style><style>:root,body{background:#f3f5f9;color:#172f50;font-family:Inter,"Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
.kst-brand{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:13px 0;display:flex;align-items:center}
.kst-brand img{width:186px;max-width:50vw;height:auto;display:block;mix-blend-mode:multiply}
body>header.kst-hero{box-sizing:border-box;position:relative;inset:auto;width:min(1080px,calc(100% - 32px));margin:0 auto;padding:clamp(24px,4vw,58px);min-height:142px;display:flex;align-items:center;gap:20px;justify-content:space-between;border-radius:clamp(22px,4vw,48px);color:white;background:#0a376d linear-gradient(105deg,rgba(6,37,83,.98) 3%,rgba(5,55,111,.91) 43%,rgba(9,73,151,.55) 100%);isolation:isolate;overflow:hidden}
.kst-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,#072655 6%,#083c78ed 45%,#064a9780),url('assets/kst-equipment.jpg') center 45%/cover}
.kst-hero h1{font-size:clamp(28px,4.5vw,56px);line-height:1.05;letter-spacing:-.035em;margin:0;color:white;overflow-wrap:anywhere}
.kst-hero #who,.kst-hero #serverLamp{color:white;font-size:13px}
main{width:min(1080px,100%);max-width:1080px;margin:20px auto;padding:0 16px 48px;box-sizing:border-box}
body section.card,main>section,main article,#accounts,#trends{background:white;border:1px solid #dae2ed;border-radius:20px;box-shadow:0 4px 18px #193e6e08}
body button,body a.action{background:#125ba3;color:white;border:1px solid transparent;border-radius:10px;cursor:pointer}
body button:hover,body a.action:hover{background:#094880;color:white}
body button.alt,.actions button:not(.primary),body button.doc{background:#edf4fb;color:#134c85;border:1px solid #cbddef}
body button:focus-visible,body a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #529be3;outline-offset:2px}
body button.primary,#cameraStart{background:#145faa;color:white}
a,summary,.steps .selected{color:#145da3}
input:not([type=checkbox]),select,textarea{border-color:#c8d5e4;color:#18385c;background:white}
body p,small,.steps,.cameraTop span{color:#53667e}
#cameraPlaceholder{background:radial-gradient(ellipse at top,#214e79,#0c213d);color:#fff}
#cameraPlaceholder p,.scanIcon{color:#bad5ed}
#plots figure{background:#14365a}
#login{max-width:510px;margin:24px auto;padding:clamp(22px,4vw,36px)}
#signin{display:grid;gap:16px}#signin input{width:100%;height:44px}#signin button{min-height:44px}
#users p{display:flex;align-items:center;flex-wrap:wrap;gap:6px;border-bottom:1px solid #e1e8f1;padding:9px 0}
@media(max-width:600px){.kst-brand{padding:9px 0}.kst-brand img{width:145px}body>header.kst-hero{min-height:80px;padding:17px 20px;gap:8px;flex-wrap:wrap}.kst-hero h1{font-size:29px}main{margin-top:14px;padding:0 12px 32px}.actions button,.actions a{min-height:42px}}
</style><div class="kst-brand"><img src="assets/kst-logo.png" alt="КСТ Энерго Инжиниринг"></div><header class="kst-hero"><h1 id="title">Осмотр оборудования</h1><span id="who"></span></header><main><p id="msg" role="status"></p><section id="login" hidden><h2>Вход</h2><form id="signin"><label>Логин<input name="login" required autocomplete="username"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button>Войти</button></form></section><div id="cab" hidden><div class="row"><a id="camera" class="action" href="/mobile.html">Открыть камеру</a><button id="logout" class="alt">Выйти</button></div><section id="accounts" hidden><h2>Учётные записи</h2><div id="users"></div><button id="newUser">Создать пользователя</button><form id="editor" hidden><input name="id" type="hidden"><label>Логин<input name="login" required></label><label>Роль<select name="role"><option value="worker">Работник</option><option value="brigadir">Начальник цеха</option><option value="admin">Администратор</option></select></label><label>Новый пароль<input name="password" type="password" autocomplete="new-password"></label><button>Сохранить</button></form></section><h2>История осмотров</h2><div id="records"></div><button id="more" hidden>Ещё записи</button></div></main><script src="/field.js"></script></html>
